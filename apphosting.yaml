# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 2

env:
  # Sandbox checkout, independent payouts, review refund and tip checks passed.
  - variable: NEXT_PUBLIC_MARKETPLACE_CHECKOUT_ENABLED
    value: "true"
    availability: [BUILD, RUNTIME]
  # Deferred until the owner activates and registers the Twilio sender.
  - variable: NEXT_PUBLIC_MARKETPLACE_SMS_ENABLED
    value: "false"
    availability: [BUILD, RUNTIME]
  # Independent server-side gate: only set true after approved toll-free verification.
  - variable: TWILIO_TOLL_FREE_VERIFIED
    value: "false"
    availability: [RUNTIME]
  - variable: TWILIO_FROM_NUMBER
    value: "+18887416683"
    availability: [RUNTIME]
  # Phone menu + hold queue live (#194). Calls ring TWILIO_VOICE_FORWARD_TO (secret).
  - variable: TWILIO_VOICE_ENABLED
    value: "true"
    availability: [RUNTIME]
  - variable: TWILIO_VOICEMAIL_ENABLED
    value: "false"
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - BUILD
      - RUNTIME
  - variable: STRIPE_CONNECT_WEBHOOK_SECRET
    secret: STRIPE_CONNECT_WEBHOOK_SECRET
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - BUILD
      - RUNTIME
  # Outbound email via Zoho Mail. Sign in as the real mailbox; send from the
  # noreply@wontstopmoving.com alias on it.
  - variable: ZOHO_SMTP_HOST
    value: smtppro.zoho.com
    availability:
      - RUNTIME
  - variable: ZOHO_SMTP_PORT
    value: "465"
    availability:
      - RUNTIME
  - variable: ZOHO_SMTP_USER
    value: jonathan@w3develops.org
    availability:
      - RUNTIME
  - variable: ZOHO_SMTP_PASS
    secret: ZOHO_SMTP_PASS
    availability:
      - RUNTIME
  - variable: EMAIL_FROM_ADDRESS
    value: "Wont Stop Moving <noreply@wontstopmoving.com>"
    availability:
      - RUNTIME
  - variable: EMAIL_REPLY_TO
    value: support@wontstopmoving.com
    availability:
      - RUNTIME
  - variable: EMAIL_DELIVERY_PROVIDER
    value: ses
    availability:
      - RUNTIME
  - variable: SES_EMAIL_CATEGORIES
    value: 'job,release_code,review'
    availability:
      - RUNTIME
  - variable: SES_AWS_REGION
    value: us-east-2
    availability:
      - RUNTIME
  - variable: SES_CONFIGURATION_SET
    value: wontstopmoving-transactional
    availability:
      - RUNTIME
  - variable: SES_ASSUME_ROLE_ARN
    value: arn:aws:iam::454005357454:role/wontstopmoving-ses-email-worker
    availability:
      - RUNTIME
  - variable: SES_WEB_IDENTITY_AUDIENCE
    value: wontstopmoving-ses-email-worker
    availability:
      - RUNTIME
  - variable: SES_GOOGLE_SERVICE_ACCOUNT
    value: wsm-ses-email-worker@studio-6652665935-1850d.iam.gserviceaccount.com
    availability:
      - RUNTIME
  - variable: SES_ALLOWED_SNS_TOPIC_ARNS
    value: arn:aws:sns:us-east-2:454005357454:wontstopmoving-ses-events
    availability:
      - RUNTIME
  # Reward earned by a customer when someone they referred books a move.
  - variable: REFERRAL_REWARD_USD
    value: "25"
    availability:
      - RUNTIME
  # Where "new paid booking" alerts go.
  - variable: ADMIN_NOTIFICATION_EMAIL
    value: jonathan@w3develops.org
    availability:
      - RUNTIME
  # Only Cloud Scheduler calls signed as this account may run the weekly
  # blog draft job (/api/cron/blog-drafts).
  - variable: CRON_SERVICE_ACCOUNT
    value: firebase-app-hosting-compute@studio-6652665935-1850d.iam.gserviceaccount.com
    availability:
      - RUNTIME
  # Postal address in marketing email footers (required by CAN-SPAM).
  - variable: BUSINESS_POSTAL_ADDRESS
    value: "855 Maude Ave, Mountain View, CA 94043"
    availability:
      - RUNTIME
  - variable: TYPESAFE_API_KEY
    secret: TYPESAFE_API_KEY
  - variable: SODA_APP_TOKEN
    secret: SODA_APP_TOKEN
  # Google Places (New) and YouTube Data API v3: company lookups on click and YouTube numbers.
  - variable: GOOGLE_CLOUD_API_KEY
    secret: GOOGLE_CLOUD_API_KEY
    availability:
      - RUNTIME
  - variable: TWILIO_AUTH_TOKEN
    secret: TWILIO_AUTH_TOKEN
    availability: [RUNTIME]
  - variable: TWILIO_ACCOUNT_SID
    secret: TWILIO_ACCOUNT_SID
    availability: [RUNTIME]
  # Owner's phone for incoming business calls; kept as a secret so it isn't in the public repo.
  - variable: TWILIO_VOICE_FORWARD_TO
    secret: TWILIO_VOICE_FORWARD_TO
    availability: [RUNTIME]
