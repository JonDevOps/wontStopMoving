# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 2

env:
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - BUILD
      - RUNTIME
  - variable: STRIPE_CONNECT_WEBHOOK_SECRET
    secret: STRIPE_CONNECT_WEBHOOK_SECRET
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - BUILD
      - RUNTIME
  # Outbound email via Zoho Mail. Sign in as the real mailbox; send from the
  # noreply@wontstopmoving.com alias on it.
  - variable: ZOHO_SMTP_HOST
    value: smtppro.zoho.com
    availability:
      - RUNTIME
  - variable: ZOHO_SMTP_PORT
    value: "465"
    availability:
      - RUNTIME
  - variable: ZOHO_SMTP_USER
    value: jonathan@w3develops.org
    availability:
      - RUNTIME
  - variable: ZOHO_SMTP_PASS
    secret: ZOHO_SMTP_PASS
    availability:
      - RUNTIME
  - variable: EMAIL_FROM_ADDRESS
    value: "Wont Stop Moving <noreply@wontstopmoving.com>"
    availability:
      - RUNTIME
  - variable: EMAIL_REPLY_TO
    value: support@wontstopmoving.com
    availability:
      - RUNTIME
