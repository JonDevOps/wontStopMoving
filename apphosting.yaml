# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 2

env:
  - variable: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - BUILD
      - RUNTIME
  - variable: STRIPE_CONNECT_WEBHOOK_SECRET
    secret: STRIPE_CONNECT_WEBHOOK_SECRET
    availability:
      - RUNTIME
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - BUILD
      - RUNTIME
  # Outbound email via Zoho Mail. Sign in as the real mailbox; send from the
  # noreply@wontstopmoving.com alias on it.
  - variable: ZOHO_SMTP_HOST
    value: smtppro.zoho.com
    availability:
      - RUNTIME
  - variable: ZOHO_SMTP_PORT
    value: "465"
    availability:
      - RUNTIME
  - variable: ZOHO_SMTP_USER
    value: jonathan@w3develops.org
    availability:
      - RUNTIME
  - variable: ZOHO_SMTP_PASS
    secret: ZOHO_SMTP_PASS
    availability:
      - RUNTIME
  - variable: EMAIL_FROM_ADDRESS
    value: "Wont Stop Moving <noreply@wontstopmoving.com>"
    availability:
      - RUNTIME
  - variable: EMAIL_REPLY_TO
    value: support@wontstopmoving.com
    availability:
      - RUNTIME
  # Reward earned by a customer when someone they referred books a move.
  - variable: REFERRAL_REWARD_USD
    value: "25"
    availability:
      - RUNTIME
  # Where "new paid booking" alerts go.
  - variable: ADMIN_NOTIFICATION_EMAIL
    value: jonathan@w3develops.org
    availability:
      - RUNTIME
  # Only Cloud Scheduler calls signed as this account may run the weekly
  # blog draft job (/api/cron/blog-drafts).
  - variable: CRON_SERVICE_ACCOUNT
    value: firebase-app-hosting-compute@studio-6652665935-1850d.iam.gserviceaccount.com
    availability:
      - RUNTIME
  # Postal address in marketing email footers (required by CAN-SPAM).
  - variable: BUSINESS_POSTAL_ADDRESS
    value: "855 Maude Ave, Mountain View, CA 94043"
    availability:
      - RUNTIME
  - variable: TYPESAFE_API_KEY
    secret: TYPESAFE_API_KEY
  - variable: SODA_APP_TOKEN
    secret: SODA_APP_TOKEN
